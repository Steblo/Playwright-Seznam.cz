name: Daily Playwright Tests

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore ./TestProject3.csproj

      - name: Build project
        run: dotnet build ./TestProject3.csproj

      - name: Install Playwright browsers
        run: dotnet playwright install --with-deps

      - name: Run tests
        run: dotnet test ./TestProject3.csproj --logger "trx"
