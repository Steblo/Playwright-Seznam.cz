name: Playwright Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Playwright-Seznam.cz2/TestProject3.csproj

      - name: Build project
        run: dotnet build Playwright-Seznam.cz2/TestProject3.csproj

      - name: Install Playwright browsers
        run: dotnet playwright install --with-deps

      - name: Run tests
        run: dotnet test Playwright-Seznam.cz2/TestProject3.csproj --logger "trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Playwright-Seznam.cz2/TestResults
